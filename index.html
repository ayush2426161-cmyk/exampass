<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <style>
        .container{
            width: 100vw;
            height: 100vh;
            background-color: #8BC6EC;
            background-image: linear-gradient(135deg,#8BC6EC 0%,#9599E2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 400px;
            height: 800px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 5px 5px 100px yellowgreen;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card img{
            height: 50%;
            padding: 30px;
            transition : all 0.4s ease;
            border-radius: 30%;
        }
        .card img:hover{
            transform: scale(1.15);
        }
        .card h3{
            font-weight: bold;
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
        }
        .card p{
            font-weight: bold;
            padding: 10px;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="qrs.jpeg" alt="LOAD HO RHA HAI">

            <h3>
                DONATE MONEY TO GET FULL MARKS IN EXAMS...
            </h3>
            <p>
                Students who pay a minimum of ₹20 will be considered “guaranteed pass” for the exam.  
Those who don’t pay will be considered “guaranteed fail.”  
Pay ₹20 and secure your imaginary pass — no refunds, no excuses.
            </p>
        </div>
    </div>
</body>
</html>
